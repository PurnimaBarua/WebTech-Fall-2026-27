<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <title>Student Information Form</title>
    </head>
    <body>
        <h1>Student Information Form</h1>

        <form>
            <fieldset>
                <legend>Student's Profile</legend>
                <table>
                    <tr>
                        <td><label for="studentName">Student Name:</label></td>
                        <td><input type="text" name="studentName" id="studentName" placeholder="Enter your name"></td>
                    </tr>
                    <tr>
                        <td><label for="studentCGPA">CGPA:</label></td>
                        <td><input type="number" name="studentCGPA" id="studentCGPA" min="0" max="4" step="0.01" placeholder="Enter your CGPA"></td>
                    </tr>
                    <tr>
                        <td><label for="dob">DOB:</label></td>
                        <td><input type="date" name="dob" id="dob"></td>
                    </tr>
                    <tr>
                        <td><label>Gender:</label></td>
                        <td>
                            <input type="radio" name="gender" id="male" value="male">
                            <label for="male">Male</label>
                        </td>
                        <td>
                            <input type="radio" name="gender" id="female" value="female">
                            <label for="female">Female</label>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>Education</legend>
                <table border="1" cellpadding="5" cellspacing="0">
                    <tr>
                        <th>Program</th>
                        <th>Major</th>
                        <th>Year</th>
                        <th>Result</th>
                    </tr>
                    <tr>
                        <td>SSC</td>
                        <td><input type="text" name="sscMajor" id="sscMajor" placeholder="Enter SSC major"></td>
                        <td><input type="number" name="sscYear" id="sscYear" placeholder="Enter SSC year"></td>
                        <td><input type="number" name="sscResult" id="sscResult" placeholder="Enter SSC result"></td>
                    </tr>
                    <tr>
                        <td>HSC</td>
                        <td><input type="text" name="hscMajor" id="hscMajor" placeholder="Enter HSC major"></td>
                        <td><input type="number" name="hscYear" id="hscYear" placeholder="Enter HSC year"></td>
                        <td><input type="number" name="hscResult" id="hscResult" placeholder="Enter HSC result"></td>
                    </tr>
                    <tr>
                        <td>BSc</td>
                        <td><input type="text" name="bscMajor" id="bscMajor" placeholder="Enter BSc major"></td>
                        <td><input type="number" name="bscYear" id="bscYear" placeholder="Enter BSc year"></td>
                        <td><input type="number" name="bscResult" id="bscResult" placeholder="Enter BSc result"></td>
                    </tr>
                </table>

                <p>
                    <label for="profilePicture">Student Photo:</label>
                    <input type="file" id="profilePicture" name="profilePicture" accept="image/*">
                </p>
            </fieldset>

            <br>
            <button type="submit">Submit</button>
        </form>
    </body>
</html>
